
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <style>
        /* Website Background */
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        /* Main Heading */
        h1 {
            color: darkblue;
            font-size: 36px;
        }
        /* Second Heading */
        h2 {
            color: purple;
        }
        /* Paragraph */
        p {
            color: darkslategray;
            font-size: 20px;
        }
        /* Button Styling */
        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        /* Button Hover Effect */
        button:hover {
            background-color: purple;
        }
        /* Box Styling */
        .box {
            background-color: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 15px;
            border: 2px solid darkblue;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Welcome to My Portfolio</h1>
        <h2>About Me</h2>
        <p>My name is Alisha.</p>
        <p>I am an Artificial Intelligence student.</p>
        <p>Welcome to my personal website!</p>
        <button>Click Me</button>
    </div>

</body>
</html>
